name: package

# Publishes the container image to GitHub Packages (ghcr.io).
# - New release: builds that release's tag.
# - Push to main that changes the Dockerfile or this file, or a manual run:
#   builds the latest published release.

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/package.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find release tag
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="$EVENT_TAG"
          if [ -z "$TAG" ]; then
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out the release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.rel.outputs.tag }}
          path: src

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.rel.outputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
